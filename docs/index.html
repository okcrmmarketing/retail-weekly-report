<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>리테일기획부 주간업무</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="topbar">
    <span class="topbar-title">리테일기획부 주간업무</span>
    <button id="adminOpenBtn" class="btn-link">관리자</button>
  </header>

  <div class="week-nav">
    <button id="prevWeekBtn" class="btn btn-secondary btn-sm">◀ 이전주</button>
    <span id="weekLabel" class="week-label">2026-W38</span>
    <button id="thisWeekBtn" class="btn btn-secondary btn-sm">이번주</button>
    <button id="nextWeekBtn" class="btn btn-secondary btn-sm">다음주 ▶</button>
  </div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="work">업무보고</button>
    <button class="tab-btn" data-tab="trend">트렌드보고</button>
    <button class="tab-btn" data-tab="vacation">휴가자현황</button>
    <button class="tab-btn" data-tab="present">발표모드</button>
  </nav>

  <main id="mainContent">

    <!-- 업무보고 -->
    <section id="tab-work" class="tab-panel active">
      <div class="section-toolbar">
        <button id="printWorkBtn" class="btn btn-secondary btn-sm">인쇄</button>
        <button id="downloadWorkBtn" class="btn btn-secondary btn-sm">다운로드</button>
      </div>
      <div id="workTeamsContainer" class="teams-container"></div>
    </section>

    <!-- 트렌드보고 -->
    <section id="tab-trend" class="tab-panel">
      <div id="trendTeamsContainer" class="teams-container"></div>
    </section>

    <!-- 휴가자현황 -->
    <section id="tab-vacation" class="tab-panel">
      <div id="vacationTeamsContainer" class="teams-container"></div>
    </section>

    <!-- 발표모드 -->
    <section id="tab-present" class="tab-panel">
      <div class="present-intro">
        <p>발표 순서를 정한 뒤 발표 시작을 누르면 팀별로 전체화면 슬라이드가 넘어갑니다.</p>
        <div id="orderList" class="order-list"></div>
        <button id="startPresentBtn" class="btn btn-primary">발표 시작 (전체화면)</button>
      </div>
    </section>

  </main>

  <!-- 발표모드 전체화면 오버레이 -->
  <div id="presentOverlay" class="present-overlay hidden">
    <div class="present-page-indicator"><span id="presentPageNum">1</span> / <span id="presentPageTotal">1</span></div>
    <button id="presentExitBtn" class="present-exit">닫기 ✕</button>
    <button id="presentPrevBtn" class="present-arrow present-arrow-left">◀</button>
    <div id="presentSlide" class="present-slide"></div>
    <button id="presentNextBtn" class="present-arrow present-arrow-right">▶</button>
  </div>

  <!-- 관리자 모달 -->
  <div id="adminModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>관리자</h2>
        <button id="adminCloseBtn" class="btn-link">닫기</button>
      </div>

      <div id="adminLoginPanel">
        <p class="subtitle">관리자 비밀번호를 입력하세요. (최초 접속 시 입력한 값이 새 비밀번호로 등록됩니다)</p>
        <input id="adminPasswordInput" type="password" placeholder="비밀번호" />
        <p id="adminLoginError" class="error hidden"></p>
        <button id="adminLoginBtn" class="btn btn-primary">로그인</button>
      </div>

      <div id="adminPanel" class="hidden">
        <h3>팀 관리</h3>
        <div id="adminTeamList" class="admin-team-list"></div>
        <button id="adminAddTeamBtn" class="btn btn-secondary btn-sm">+ 팀 추가</button>
        <button id="adminSaveTeamsBtn" class="btn btn-primary btn-sm">팀 목록 저장</button>

        <h3>비밀번호 변경</h3>
        <input id="adminNewPassword1" type="password" placeholder="새 비밀번호" />
        <input id="adminNewPassword2" type="password" placeholder="새 비밀번호 확인" />
        <button id="adminChangePasswordBtn" class="btn btn-secondary btn-sm">비밀번호 변경</button>
        <p id="adminActionMsg" class="hint"></p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
