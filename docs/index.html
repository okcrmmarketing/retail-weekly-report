<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>리테일기획부 주간업무</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-title">
      <span class="eyebrow">WEEKLY REPORT</span>
      <h1>리테일기획부 주간업무 <button id="adminOpenBtn" class="icon-btn" title="관리자" aria-label="관리자">⚙</button></h1>
    </div>
    <div class="week-pill-wrap">
      <div class="week-pill">
        <button id="prevWeekBtn" class="week-arrow" aria-label="이전주">‹</button>
        <span id="weekLabel" class="week-label">2026-W38</span>
        <button id="nextWeekBtn" class="week-arrow" aria-label="다음주">›</button>
      </div>
      <button id="thisWeekBtn" class="btn-link-sm">이번주로</button>
    </div>
  </header>

  <nav class="type-tabs">
    <button class="type-tab-btn active" data-tab="work">업무보고</button>
    <button class="type-tab-btn" data-tab="trend">트렌드보고</button>
  </nav>

  <main id="mainContent">

    <div class="panel-toolbar">
      <div id="teamTabs" class="team-tabs"></div>
      <div class="toolbar-actions">
        <button id="openOrderBtn" class="btn btn-outline btn-sm">발표 순서</button>
        <button id="startPresentBtn" class="btn btn-outline btn-sm">발표 모드</button>
        <button id="downloadAllBtn" class="btn btn-outline btn-sm">팀별로 각각 다운로드</button>
      </div>
    </div>

    <!-- 업무보고 -->
    <section id="tab-work" class="tab-panel active">
      <div class="split-view">
        <div class="edit-col">
          <div class="field-section">
            <div class="field-section-head">
              <span class="field-section-title">01 이번주 업무</span>
              <button id="loadPrevWorkBtn" class="btn btn-ghost btn-xs">⟲ 저번주 업무 불러오기</button>
            </div>
            <div id="workItemsWrap" class="item-cards"></div>
            <button id="addWorkItemBtn" class="btn btn-dashed">+ 카테고리 추가</button>
          </div>

          <div class="field-section">
            <div class="field-section-head">
              <span class="field-section-title">02 이번 주 휴가자</span>
            </div>
            <div id="vacationRowsWrap" class="vac-rows-wrap"></div>
            <button id="addVacationBtn" class="btn btn-dashed">+ 휴가자 추가</button>
          </div>

          <div class="edit-actions">
            <button id="resetTeamBtn" class="btn btn-outline">이 팀 초기화</button>
            <button id="refreshBtn" class="btn btn-outline">새로고침</button>
            <button id="saveWorkBtn" class="btn btn-solid">저장하기</button>
          </div>
        </div>

        <div class="preview-col">
          <div id="workPreview" class="preview-card"></div>
          <div class="preview-actions">
            <button id="copyWorkBtn" class="btn btn-outline btn-sm">복사하기</button>
            <button id="downloadWorkBtn" class="btn btn-outline btn-sm">다운로드</button>
            <button id="printWorkBtn" class="btn btn-outline btn-sm">인쇄</button>
            <button id="printAllWorkBtn" class="btn btn-outline btn-sm">업무보고 전체 인쇄</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 트렌드보고 -->
    <section id="tab-trend" class="tab-panel">
      <div class="split-view">
        <div class="edit-col">
          <div id="trendPersonTabs" class="person-tabs"></div>
          <p id="trendAuthorLine" class="author-line"></p>

          <div id="trendNoMemberHint" class="hint hidden">이 팀에 등록된 팀원이 없습니다. 관리자(⚙)에서 팀원을 먼저 등록해주세요.</div>

          <div id="trendEditBody">
            <div class="field-section">
              <div class="field-section-head"><span class="field-section-title">01 전체 레이아웃</span></div>
              <div class="layout-toggle">
                <button class="btn btn-outline" data-layout="row">☰ 좌우형 (이미지-내용 나란히)</button>
                <button class="btn btn-outline" data-layout="col">▭ 상하형 (이미지 위, 내용 아래)</button>
              </div>
            </div>

            <div class="field-section">
              <div class="field-section-head"><span class="field-section-title">02 제목</span></div>
              <input id="trendTitleInput" placeholder="트렌드 제목" />
            </div>

            <div class="field-section">
              <div class="field-section-head"><span class="field-section-title">03 이미지</span></div>
              <div id="trendImagesGrid" class="trend-images-grid"></div>
            </div>

            <div class="field-section">
              <div class="field-section-head"><span class="field-section-title">04 내용</span></div>
              <textarea id="trendContentInput" rows="6" placeholder="트렌드 내용을 입력하세요"></textarea>
            </div>
          </div>

          <div class="edit-actions">
            <button id="resetTrendBtn" class="btn btn-outline">이 팀 초기화</button>
            <button id="refreshTrendBtn" class="btn btn-outline">새로고침</button>
            <button id="saveTrendBtn" class="btn btn-solid">저장하기</button>
          </div>
        </div>

        <div class="preview-col">
          <div id="trendPreview" class="preview-card"></div>
          <div class="preview-actions">
            <button id="copyTrendBtn" class="btn btn-outline btn-sm">복사하기</button>
            <button id="downloadTrendBtn" class="btn btn-outline btn-sm">다운로드</button>
            <button id="printTrendBtn" class="btn btn-outline btn-sm">인쇄</button>
            <button id="printAllTrendBtn" class="btn btn-outline btn-sm">트렌드보고 전체 인쇄</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- 발표 순서 모달 -->
  <div id="orderModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>발표 순서</h2>
        <button id="orderCloseBtn" class="btn-link">닫기</button>
      </div>
      <p class="subtitle">▲▼ 버튼으로 순서를 조정하세요. 조정 즉시 저장됩니다.</p>
      <div class="order-type-tabs">
        <button class="order-type-btn active" data-order-type="work">업무보고 순서</button>
        <button class="order-type-btn" data-order-type="trend">트렌드보고 순서</button>
      </div>
      <div id="orderList" class="order-list"></div>
    </div>
  </div>

  <!-- 발표모드 -->
  <div id="presentOverlay" class="present-overlay hidden">
    <div class="present-topbar">
      <span class="present-page-indicator"><span id="presentPageNum">1</span> / <span id="presentPageTotal">1</span></span>
      <span class="present-week-label" id="presentWeekLabel"></span>
      <span class="present-topbar-actions">
        <button id="presentFullscreenBtn" class="btn btn-outline btn-sm">⛶ 전체화면</button>
        <button id="presentExitBtn" class="btn btn-outline btn-sm">✕ 편집으로 돌아가기 (Esc)</button>
      </span>
    </div>
    <div id="presentSlide" class="present-slide"></div>
    <div class="present-bottom-nav">
      <button id="presentPrevBtn" class="present-nav-circle" aria-label="이전">‹</button>
      <div id="presentDots" class="present-dots"></div>
      <button id="presentNextBtn" class="present-nav-circle" aria-label="다음">›</button>
    </div>
  </div>

  <!-- 인쇄 전용 영역 (전체 인쇄용) -->
  <div id="printAllArea" class="print-only-area"></div>

  <!-- 관리자 모달 -->
  <div id="adminModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>관리자</h2>
        <button id="adminCloseBtn" class="btn-link">닫기</button>
      </div>

      <div id="adminLoginPanel">
        <p class="subtitle">관리자 비밀번호를 입력하세요. (최초 접속 시 입력한 값이 새 비밀번호로 등록됩니다)</p>
        <input id="adminPasswordInput" type="password" placeholder="비밀번호" />
        <p id="adminLoginError" class="error hidden"></p>
        <button id="adminLoginBtn" class="btn btn-solid">로그인</button>
      </div>

      <div id="adminPanel" class="hidden">
        <h3>팀 관리</h3>
        <div id="adminTeamList" class="admin-team-list"></div>
        <button id="adminAddTeamBtn" class="btn btn-outline btn-sm">+ 팀 추가</button>
        <button id="adminSaveTeamsBtn" class="btn btn-solid btn-sm">팀 목록 저장</button>

        <h3>비밀번호 변경</h3>
        <input id="adminNewPassword1" type="password" placeholder="새 비밀번호" />
        <input id="adminNewPassword2" type="password" placeholder="새 비밀번호 확인" />
        <button id="adminChangePasswordBtn" class="btn btn-outline btn-sm">비밀번호 변경</button>
        <p id="adminActionMsg" class="hint"></p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
